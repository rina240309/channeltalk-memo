<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상담 메모</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: #f7f8fc;
      color: #2d3748;
      font-size: 13px;
    }

    .container { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

    /* 입력 영역 */
    .input-area {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-size: 13px;
      font-family: inherit;
      color: #2d3748;
      background: transparent;
      height: 64px;
      line-height: 1.6;
    }

    textarea::placeholder { color: #a0aec0; }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hint { font-size: 11px; color: #a0aec0; }

    .btn-save {
      padding: 6px 16px;
      background: #4263eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: background 0.15s;
    }
    .btn-save:hover:not(:disabled) { background: #3451c7; }
    .btn-save:disabled { background: #a0aec0; cursor: not-allowed; }

    /* 섹션 헤더 */
    .section-header {
      font-size: 11px;
      font-weight: 700;
      color: #718096;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 2px;
    }

    /* 메모 목록 */
    .memo-list { display: flex; flex-direction: column; gap: 6px; }

    .memo-item {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: box-shadow 0.15s;
    }
    .memo-item:hover { box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

    .memo-content {
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
      color: #2d3748;
    }

    .memo-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .memo-time { font-size: 11px; color: #a0aec0; }

    .btn-delete {
      background: none;
      border: none;
      color: #cbd5e0;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 0;
      transition: color 0.15s;
    }
    .btn-delete:hover { color: #fc8181; }

    /* 빈 상태 / 로딩 */
    .state-msg {
      text-align: center;
      color: #a0aec0;
      padding: 20px 0;
      font-size: 12px;
    }

    /* 에러 토스트 */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: #fc8181;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 메모 입력 -->
    <div class="input-area">
      <textarea id="memoInput" placeholder="상담 메모를 입력하세요..."></textarea>
      <div class="input-footer">
        <span class="hint">Ctrl + Enter 로 저장</span>
        <button class="btn-save" id="saveBtn" onclick="addMemo()">저장</button>
      </div>
    </div>

    <!-- 메모 이력 -->
    <div class="section-header">상담 메모 이력</div>
    <div class="memo-list" id="memoList">
      <div class="state-msg">불러오는 중...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 채널톡이 쿼리 파라미터로 넘겨주는 userId를 읽어요.
    // 채널톡 스니펫 설정에서 URL에 ?userId={{user.id}} 형태로 붙여주세요.
    const params  = new URLSearchParams(window.location.search);
    const userId  = params.get('userId') || params.get('id') || params.get('user_id') || '';
    const apiBase = window.location.origin;

    /* ── 유틸 ─────────────────────────────────────────── */

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('ko-KR', { month: '2-digit', day: '2-digit' }) +
             ' ' +
             d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    /* ── 메모 렌더링 ──────────────────────────────────── */

    function renderMemos(memos) {
      const list = document.getElementById('memoList');
      if (!memos.length) {
        list.innerHTML = '<div class="state-msg">저장된 메모가 없어요.</div>';
        return;
      }
      list.innerHTML = memos.map(m => `
        <div class="memo-item" id="memo-${m.id}">
          <div class="memo-content">${escapeHtml(m.content)}</div>
          <div class="memo-footer">
            <span class="memo-time">${formatDate(m.created_at)}</span>
            <button class="btn-delete" onclick="deleteMemo(${m.id})" title="삭제">×</button>
          </div>
        </div>
      `).join('');
    }

    /* ── API 호출 ─────────────────────────────────────── */

    async function loadMemos() {
      if (!userId) {
        document.getElementById('memoList').innerHTML =
          '<div class="state-msg">사용자 ID가 전달되지 않았어요.</div>';
        return;
      }
      try {
        const res   = await fetch(`${apiBase}/api/memos/${encodeURIComponent(userId)}`);
        const memos = await res.json();
        renderMemos(memos);
      } catch {
        document.getElementById('memoList').innerHTML =
          '<div class="state-msg">메모를 불러오지 못했어요.</div>';
      }
    }

    async function addMemo() {
      const input   = document.getElementById('memoInput');
      const content = input.value.trim();
      if (!content) return;

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;

      try {
        const res = await fetch(`${apiBase}/api/memos`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ userId, content })
        });
        if (!res.ok) throw new Error();
        input.value = '';
        await loadMemos();
      } catch {
        showToast('저장에 실패했어요. 다시 시도해주세요.');
      } finally {
        btn.disabled = false;
      }
    }

    async function deleteMemo(id) {
      if (!confirm('이 메모를 삭제할까요?')) return;
      try {
        const res = await fetch(`${apiBase}/api/memos/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error();
        document.getElementById(`memo-${id}`)?.remove();
        if (!document.querySelector('.memo-item')) {
          document.getElementById('memoList').innerHTML =
            '<div class="state-msg">저장된 메모가 없어요.</div>';
        }
      } catch {
        showToast('삭제에 실패했어요.');
      }
    }

    /* ── 단축키 ───────────────────────────────────────── */

    document.getElementById('memoInput').addEventListener('keydown', e => {
      if (e.key === 'Enter' && e.ctrlKey) addMemo();
    });

    /* ── 초기 로드 ────────────────────────────────────── */
    loadMemos();
  </script>
</body>
</html>
